<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Где я был в России</title>
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --text: #1d1f23;
    --muted: #6b6f78;
    --line: #e3e1da;
    --sea: #eef1f4;
    --border: #ffffff;
    --s0: #d9d8d3;
    --s0-hover: #c6c5bf;
    --s1: #f2c94c;
    --s1-hover: #e5b92f;
    --s2: #4fa36b;
    --s2-hover: #3f8f5a;
    --dot: #1d1f23;
    --dot-ring: #ffffff;
    --label: #1d1f23;
    --label-halo: rgba(255,255,255,.85);
    --accent: #2f6fde;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --panel: #1e2125; --text: #e8e8e6; --muted: #9a9ea6; --line: #2e3238;
      --sea: #181b1f; --border: #15171a;
      --s0: #3a3e45; --s0-hover: #4a4f57; --s1: #d6aa2c; --s1-hover: #e6bb3d; --s2: #3e9a5e; --s2-hover: #4fb06f;
      --dot: #f2f2f0; --dot-ring: #15171a; --label: #f2f2f0; --label-halo: rgba(21,23,26,.85);
      --accent: #6ea2ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --panel: #1e2125; --text: #e8e8e6; --muted: #9a9ea6; --line: #2e3238;
    --sea: #181b1f; --border: #15171a;
    --s0: #3a3e45; --s0-hover: #4a4f57; --s1: #d6aa2c; --s1-hover: #e6bb3d; --s2: #3e9a5e; --s2-hover: #4fb06f;
    --dot: #f2f2f0; --dot-ring: #15171a; --label: #f2f2f0; --label-halo: rgba(21,23,26,.85);
    --accent: #6ea2ff; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100vh; overflow: hidden;
  }
  aside, #mapWrap { min-width: 0; }
  #mapWrap { position: relative; overflow: hidden; background: var(--sea); }
  svg { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  svg:active { cursor: grabbing; }
  .region { stroke: none; cursor: pointer; transition: fill .15s; }
  .bd { fill: none; stroke: var(--border); stroke-width: .8; vector-effect: non-scaling-stroke; stroke-linejoin: round; pointer-events: none; }
  .bd.flash { stroke: var(--accent); stroke-width: 2.5; }
  .region.s0 { fill: var(--s0); } .region.s1 { fill: var(--s1); } .region.s2 { fill: var(--s2); }
  @media (hover: hover) {
    .region.s0:hover { fill: var(--s0-hover); } .region.s1:hover { fill: var(--s1-hover); } .region.s2:hover { fill: var(--s2-hover); }
  }
  .cap { fill: var(--dot); stroke: var(--dot-ring); vector-effect: non-scaling-stroke; stroke-width: 1.2; cursor: pointer; }
  .cap.on { fill: var(--dot); }
  .lbl { fill: var(--label); paint-order: stroke; stroke: var(--label-halo); stroke-width: 3px; stroke-linejoin: round;
         pointer-events: none; font-weight: 500; }

  .zoomCtl { position: absolute; left: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  .zoomCtl button, .topBtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font-size: 18px; cursor: pointer; box-shadow: var(--shadow); display: grid; place-items: center; }
  .zoomCtl button:hover, .topBtn:hover { border-color: var(--muted); }
  .hint { position: absolute; left: 16px; top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; box-shadow: var(--shadow); color: var(--muted); font-size: 12.5px; max-width: 360px; }
  .hint b { color: var(--text); font-weight: 600; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; box-shadow: var(--shadow); font-size: 13px; white-space: nowrap; opacity: 0; transition: opacity .1s; }
  #tip .t { font-weight: 600; } #tip .c { color: var(--muted); font-size: 12px; }

  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 0 12px; letter-spacing: -.01em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat .n { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .bar { height: 8px; border-radius: 4px; background: var(--s0); overflow: hidden; display: flex; }
  .bar > div { height: 100%; transition: width .3s; }
  .pct { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .search { margin: 12px 18px 8px; }
  .search input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font: inherit; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .filters { display: flex; gap: 6px; margin: 0 18px 8px; flex-wrap: wrap; }
  .filters button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px;
    font: inherit; font-size: 12px; cursor: pointer; }
  .filters button.on { background: var(--text); color: var(--panel); border-color: var(--text); }
  #list { overflow-y: auto; flex: 1; min-height: 0; padding: 0 8px 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; }
  .row:hover { background: var(--bg); }
  .row .nm { flex: 1; min-width: 0; cursor: pointer; }
  .row .nm div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nm .cc { font-size: 11.5px; color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
  .seg button { width: 26px; height: 24px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button i { width: 10px; height: 10px; border-radius: 3px; display: block; opacity: .35; }
  .seg button.on i { opacity: 1; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px currentColor; }
  .foot { border-top: 1px solid var(--line); padding: 10px 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  .foot button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 8px; padding: 6px 10px;
    font: inherit; font-size: 12.5px; cursor: pointer; }
  .foot button:hover { border-color: var(--muted); }
  .foot .danger { color: #c4473a; margin-left: auto; }

  .titleRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .titleRow h1 { margin: 0; }
  .grab, .sheetBtn { display: none; }
  .titleBtns { display: flex; gap: 6px; flex: none; }
  .shareBtn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--accent); color: #fff;
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  .shareBtn:hover { filter: brightness(1.08); }
  .shareBtn svg { flex: none; }
  #viewBar { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 10px;
    flex-wrap: wrap; justify-content: center; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
    padding: 8px 10px 8px 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); z-index: 3; }
  #viewBar .vt { font-size: 13px; } #viewBar .vt b { font-weight: 600; } #viewStats { white-space: nowrap; }
  #viewBar .vb { display: flex; gap: 6px; }
  #viewBar button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 8px;
    padding: 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  #viewBar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #viewBar.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(calc(-50% - 6px)); } 75% { transform: translateX(calc(-50% + 6px)); } }
  body.viewing #viewBar { display: flex; }
  body.viewing .hint, body.viewing .shareBtn, body.viewing .foot { display: none; }
  body.viewing .seg { opacity: .55; pointer-events: none; }
  body.viewing .region, body.viewing .cap { cursor: default; }
  #toast { position: absolute; left: 50%; bottom: 24px; transform: translate(-50%, 10px); background: var(--text); color: var(--panel);
    padding: 9px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; z-index: 4; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* phones: map fills the screen, the panel is a bottom sheet */
  @media (max-width: 820px) {
    body { display: block; position: relative; height: 100vh; height: 100dvh; }
    #mapWrap { position: absolute; left: 0; right: 0; top: 0; bottom: calc(var(--headH, 150px) - 14px); }
    aside { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; overflow: hidden;
      height: calc(var(--headH, 150px) + env(safe-area-inset-bottom)); border: 0; border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,.14); transition: height .25s ease; }
    aside.open { height: 85vh; height: 85dvh; }
    .grab { display: block; width: 100%; height: 20px; border: 0; background: transparent; padding: 0; cursor: pointer; }
    .grab span { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
    .sheetBtn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: transparent;
      color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
    .head { padding: 0 16px 10px; border-bottom: 1px solid transparent; }
    aside.open .head { border-bottom-color: var(--line); }
    h1 { font-size: 16px; }
    .titleRow { margin-bottom: 8px; }
    .stats { gap: 6px; margin-bottom: 8px; }
    .stat { padding: 6px 8px; } .stat .n { font-size: 17px; } .stat .l { font-size: 11px; }
    .search { margin: 10px 16px 6px; } .search input { font-size: 16px; padding: 9px 12px; }
    .filters { margin: 0 16px 6px; } .filters button { padding: 5px 12px; font-size: 13px; }
    .row { padding: 8px 8px; }
    .seg button { width: 38px; height: 34px; }
    .seg button i { width: 12px; height: 12px; }
    .foot { padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
    .hint { display: none; }
    .zoomCtl { left: auto; right: 12px; top: 12px; bottom: auto; }
    .zoomCtl button { width: 40px; height: 40px; }
    .shareBtn { padding: 7px 10px; } .shareBtn span { display: none; }
    #viewBar { top: 12px; left: 12px; right: 64px; transform: none; max-width: none; justify-content: flex-start; }
    #viewBar.shake { animation: none; }
    #viewBar .vt b { display: block; } #viewBar .sep { display: none; }
    #toast { bottom: 28px; }
  }
</style>
</head>
<body>
<div id="mapWrap">
  <svg id="map"><g id="zoomLayer"><g id="regions"></g><g id="borders"></g><g id="caps"></g><g id="labels"></g></g></svg>
  <div class="hint">Клик по региону: <b>серый → жёлтый → зелёный</b>. Клик по точке столицы — сразу зелёный. Колёсико / щипок — масштаб.</div>
  <div class="zoomCtl">
    <button id="zin" title="Приблизить">+</button>
    <button id="zout" title="Отдалить">−</button>
    <button id="zreset" title="Вся карта" style="font-size:15px">⤢</button>
  </div>
  <div id="tip"></div>
  <div id="viewBar">
    <div class="vt"><b>Чужая карта</b><span class="sep"> · </span><span id="viewStats"></span></div>
    <div class="vb"><button class="primary" id="adopt">Сделать своей</button><button id="leave">К моей карте</button></div>
  </div>
  <div id="toast"></div>
</div>
<aside>
  <div class="head">
    <button class="grab" id="grab" aria-label="Показать или скрыть список"><span></span></button>
    <div class="titleRow"><h1>Где я был в России</h1><div class="titleBtns">
      <button class="shareBtn" id="share" title="Скопировать ссылку на мою карту"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span>Поделиться</span></button>
      <button class="sheetBtn" id="sheetBtn">Регионы ▴</button></div></div>
    <div class="stats">
      <div class="stat"><div class="n" id="n2">0</div><div class="l"><span class="sw" style="background:var(--s2)"></span>Со столицей</div></div>
      <div class="stat"><div class="n" id="n1">0</div><div class="l"><span class="sw" style="background:var(--s1)"></span>Был в регионе</div></div>
      <div class="stat"><div class="n" id="n0">0</div><div class="l"><span class="sw" style="background:var(--s0)"></span>Не был</div></div>
    </div>
    <div class="bar"><div id="b2" style="background:var(--s2)"></div><div id="b1" style="background:var(--s1)"></div></div>
    <div class="pct" id="pct"></div>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Найти регион или город…" autocomplete="off"></div>
  <div class="filters" id="filters">
    <button data-f="all" class="on">Все</button>
    <button data-f="2">Со столицей</button>
    <button data-f="1">Был</button>
    <button data-f="0">Не был</button>
  </div>
  <div id="list"></div>
  <div class="foot">
    <button id="exp" title="Скачать отметки в файл">Сохранить в файл</button>
    <button id="imp" title="Загрузить отметки из файла">Загрузить</button>
    <button id="reset" class="danger">Сбросить</button>
    <input id="file" type="file" accept="application/json,.json" hidden>
  </div>
</aside>

const KEY = 'russia-travel-map-v1';
const LABELS = ['Не был', 'Был в регионе', 'Был в столице'];
const feats = GEO.features;
const byName = new Map(feats.map(f => [f.properties.name, f]));

// ---- state ----
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
// a map opened from someone's link: shown read-only, never saved
let viewing = null;
const st = n => (viewing || state)[n] || 0;
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function setState(n, v) {
  if (viewing) { nudgeViewBar(); return; }
  if (v) state[n] = v; else delete state[n];
  save(); paint(n); stats(); renderList();
}

// ---- map ----
const svg = d3.select('#map');
const wrap = document.getElementById('mapWrap');
const gZoom = d3.select('#zoomLayer');
const proj = d3.geoConicEqualArea().parallels([52, 64]).rotate([-100, 0]);
const path = d3.geoPath(proj);
let W = 0, H = 0;

function fit() {
  W = wrap.clientWidth; H = wrap.clientHeight;
  const pad = Math.min(W, H) * 0.04;
  proj.fitExtent([[pad, pad + (isPhone() ? 0 : 40)], [W - pad, H - pad]], GEO);
}

// ---- phone bottom sheet ----
const phoneMQ = matchMedia('(max-width: 820px)');
const isPhone = () => phoneMQ.matches;
const aside = document.querySelector('aside');
const headEl = document.querySelector('.head');
const sheetBtn = document.getElementById('sheetBtn');
function measureHead() {
  document.documentElement.style.setProperty('--headH', headEl.offsetHeight + 'px');
}
function setSheet(open) {
  aside.classList.toggle('open', open);
  sheetBtn.textContent = open ? 'Карта ▾' : 'Регионы ▴';
}
document.getElementById('grab').onclick = sheetBtn.onclick = () => setSheet(!aside.classList.contains('open'));

measureHead();
fit();

const regions = d3.select('#regions').selectAll('path').data(feats).join('path')
  .attr('class', d => 'region s' + st(d.properties.name))
  .attr('d', path)
  .on('click', (e, d) => { const n = d.properties.name; setState(n, (st(n) + 1) % 3); showTip(e, d); })
  .on('mousemove', showTip)
  .on('mouseleave', hideTip);

const outlineOf = f => f.properties.outline
  ? { type: 'MultiLineString', coordinates: f.properties.outline }
  : { type: 'MultiLineString', coordinates: f.geometry.coordinates.flat() };
const borders = d3.select('#borders').selectAll('path').data(feats).join('path')
  .attr('class', 'bd')
  .attr('d', f => path(outlineOf(f)));

const caps = d3.select('#caps').selectAll('circle').data(feats).join('circle')
  .attr('class', 'cap')
  .attr('cx', d => proj([d.properties.lon, d.properties.lat])[0])
  .attr('cy', d => proj([d.properties.lon, d.properties.lat])[1])
  .on('click', (e, d) => { e.stopPropagation(); const n = d.properties.name; setState(n, st(n) === 2 ? 1 : 2); showTip(e, d); })
  .on('mousemove', showTip)
  .on('mouseleave', hideTip);

const area = new Map(feats.map(f => [f.properties.name, d3.geoArea(f)]));
const PRIORITY = ['Москва', 'Санкт-Петербург'];
const labelData = feats.slice().sort((a, b) => {
  const pr = n => { const i = PRIORITY.indexOf(n); return i === -1 ? 99 : i; };
  const d = pr(a.properties.name) - pr(b.properties.name);
  if (d) return d;
  return area.get(b.properties.name) - area.get(a.properties.name);
});
const labels = d3.select('#labels').selectAll('text').data(labelData).join('text')
  .attr('class', 'lbl')
  .text(d => d.properties.cap);

function relayout() {
  caps.attr('cx', d => proj([d.properties.lon, d.properties.lat])[0])
      .attr('cy', d => proj([d.properties.lon, d.properties.lat])[1]);
  regions.attr('d', path);
  borders.attr('d', f => path(outlineOf(f)));
}

// labels: fixed screen size, greedy collision culling
let curK = 1;
function placeLabels(t) {
  const k = t.k, fs = 11.5, placed = [];
  const r = Math.max(1.6, Math.min(4.5, 1.6 + k * 0.35));
  caps.attr('r', r / k);
  labels.each(function (d) {
    const p = proj([d.properties.lon, d.properties.lat]);
    const sx = t.applyX(p[0]), sy = t.applyY(p[1]);
    const w = d.properties.cap.length * fs * 0.56, h = fs * 1.2;
    const box = [sx + r + 3, sy - h / 2, sx + r + 3 + w, sy + h / 2];
    const visible = sx > -50 && sx < W + 50 && sy > -20 && sy < H + 20 && k >= 1.4 &&
      !placed.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]));
    if (visible) placed.push([box[0] - 2 * r - 6, box[1], box[2], box[3]]);
    d3.select(this)
      .attr('display', visible ? null : 'none')
      .attr('x', p[0] + (r + 3) / k).attr('y', p[1])
      .attr('dy', '0.35em')
      .attr('font-size', fs / k)
      .style('stroke-width', (3 / k) + 'px');
  });
}

const zoom = d3.zoom().scaleExtent([1, 60]).clickDistance(4)
  .on('zoom', e => { gZoom.attr('transform', e.transform); curK = e.transform.k; placeLabels(e.transform); hideTip(); });
svg.call(zoom).on('dblclick.zoom', null);
placeLabels(d3.zoomIdentity);

document.getElementById('zin').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.8);
document.getElementById('zout').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.8);
document.getElementById('zreset').onclick = () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);

function zoomTo(f) {
  const [[x0, y0], [x1, y1]] = path.bounds(f);
  const k = Math.min(40, 0.7 / Math.max((x1 - x0) / W, (y1 - y0) / H));
  const t = d3.zoomIdentity.translate(W / 2, H / 2).scale(Math.max(1, k)).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  svg.transition().duration(700).call(zoom.transform, t);
  const el = borders.filter(d => d === f).raise().classed('flash', true);
  setTimeout(() => el.classed('flash', false), 2200);
}

// Refit only on real size changes: on phones the address bar hides/shows
// while scrolling and slightly changes the height — the zoom must survive that.
let lastW = W, lastH = H;
window.addEventListener('resize', measureHead);
new ResizeObserver(() => {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  if (w === lastW && Math.abs(h - lastH) < lastH * 0.2) { H = h; return; }
  lastW = w; lastH = h;
  fit(); relayout();
  svg.call(zoom.transform, d3.zoomIdentity);
}).observe(wrap);

// tooltip
const tip = document.getElementById('tip');
const hoverMQ = matchMedia('(hover: hover)');
let tipTimer = 0;
function showTip(e, d) {
  const [x, y] = d3.pointer(e, wrap);
  const n = d.properties.name;
  tip.innerHTML = `<div class="t">${n}</div><div class="c">Столица: ${d.properties.cap} · ${LABELS[st(n)]}</div>`;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(x + 14, W - tw - 8)) + 'px';
  tip.style.top = (y + 16 + th > H - 8 ? y - th - 12 : y + 16) + 'px';
  tip.style.opacity = 1;
  // no hover on touch screens: hide the tooltip after a short while
  clearTimeout(tipTimer);
  if (!hoverMQ.matches) tipTimer = setTimeout(hideTip, 2000);
}
function hideTip() { tip.style.opacity = 0; }

function paint(n) {
  regions.filter(d => !n || d.properties.name === n).attr('class', d => 'region s' + st(d.properties.name));
}

// ---- sidebar ----
function stats() {
  const c = [0, 0, 0];
  feats.forEach(f => c[st(f.properties.name)]++);
  const N = feats.length;
  ['n0', 'n1', 'n2'].forEach((id, i) => document.getElementById(id).textContent = c[i]);
  document.getElementById('b2').style.width = (c[2] / N * 100) + '%';
  document.getElementById('b1').style.width = (c[1] / N * 100) + '%';
  const any = c[1] + c[2];
  document.getElementById('pct').textContent =
    `Побывал в ${any} из ${N} регионов (${Math.round(any / N * 100)}%), столиц — ${c[2]}`;
}

let filter = 'all';
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const COLORS = ['var(--s0)', 'var(--s1)', 'var(--s2)'];
const sortedFeats = feats.slice().sort((a, b) => a.properties.name.localeCompare(b.properties.name, 'ru'));

function renderList() {
  const q = qEl.value.trim().toLowerCase();
  const scroll = listEl.scrollTop;
  listEl.innerHTML = '';
  for (const f of sortedFeats) {
    const { name, cap } = f.properties, s = st(name);
    if (filter !== 'all' && String(s) !== filter) continue;
    if (q && !name.toLowerCase().includes(q) && !cap.toLowerCase().includes(q)) continue;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="nm" title="Показать на карте"><div>${name}</div><div class="cc">${cap}</div></div>
      <div class="seg">${[0, 1, 2].map(i =>
        `<button data-v="${i}" title="${LABELS[i]}" class="${s === i ? 'on' : ''}" style="color:${COLORS[i]}"><i style="background:${COLORS[i]}"></i></button>`).join('')}</div>`;
    row.querySelector('.nm').onclick = () => { if (isPhone()) setSheet(false); zoomTo(f); };
    row.querySelectorAll('.seg button').forEach(b => b.onclick = () => setState(name, +b.dataset.v));
    listEl.appendChild(row);
  }
  if (!listEl.children.length) listEl.innerHTML = '<div style="padding:16px;color:var(--muted)">Ничего не найдено</div>';
  listEl.scrollTop = scroll;
}
qEl.addEventListener('input', renderList);
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
  renderList();
});

// export / import / reset
document.getElementById('exp').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'russia-travel-map.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
const fileEl = document.getElementById('file');
document.getElementById('imp').onclick = () => fileEl.click();
fileEl.onchange = async () => {
  const file = fileEl.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const next = {};
    for (const [k, v] of Object.entries(data)) if (byName.has(k) && [1, 2].includes(v)) next[k] = v;
    state = next; save(); paint(); stats(); renderList();
  } catch (e) { alert('Не удалось прочитать файл'); }
  fileEl.value = '';
};
document.getElementById('reset').onclick = () => {
  if (!confirm('Сбросить все отметки?')) return;
  state = {}; save(); paint(); stats(); renderList();
};

// ---- share link ----
// Region order for the link format. Never reorder: new regions go to the end.
const ORDER = ["Адыгея", "Алтай", "Алтайский край", "Амурская область", "Архангельская область", "Астраханская область", "Башкортостан", "Белгородская область", "Брянская область", "Бурятия", "Владимирская область", "Волгоградская область", "Вологодская область", "Воронежская область", "Дагестан", "Еврейская автономная область", "Забайкальский край", "Ивановская область", "Ингушетия", "Иркутская область", "Кабардино-Балкарская республика", "Калининградская область", "Калужская область", "Камчатский край", "Карачаево-Черкесская республика", "Кемеровская область", "Кировская область", "Костромская область", "Краснодарский край", "Красноярский край", "Курганская область", "Курская область", "Ленинградская область", "Липецкая область", "Магаданская область", "Марий Эл", "Москва", "Московская область", "Мурманская область", "Ненецкий автономный округ", "Нижегородская область", "Новгородская область", "Новосибирская область", "Омская область", "Оренбургская область", "Орловская область", "Пензенская область", "Пермский край", "Приморский край", "Псковская область", "Республика Калмыкия", "Республика Карелия", "Республика Коми", "Республика Крым", "Республика Мордовия", "Республика Саха (Якутия)", "Республика Хакасия", "Ростовская область", "Рязанская область", "Самарская область", "Санкт-Петербург", "Саратовская область", "Сахалинская область", "Свердловская область", "Севастополь", "Северная Осетия - Алания", "Смоленская область", "Ставропольский край", "Тамбовская область", "Татарстан", "Тверская область", "Томская область", "Тульская область", "Тыва", "Тюменская область", "Удмуртская республика", "Ульяновская область", "Хабаровский край", "Ханты-Мансийский автономный округ - Югра", "Челябинская область", "Чеченская республика", "Чувашия", "Чукотский автономный округ", "Ямало-Ненецкий автономный округ", "Ярославская область"];
// 2 bits per region -> bytes -> base64url, e.g. #map=1.AAQgAA…
function encodeMap(s) {
  const bytes = new Uint8Array(Math.ceil(ORDER.length / 4));
  ORDER.forEach((n, i) => { bytes[i >> 2] |= ((s[n] || 0) & 3) << ((i & 3) * 2); });
  let end = bytes.length; while (end > 0 && !bytes[end - 1]) end--;
  return btoa(String.fromCharCode(...bytes.subarray(0, end))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeMap(str) {
  const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  const out = {};
  ORDER.forEach((n, i) => {
    const v = ((bin.charCodeAt(i >> 2) || 0) >> ((i & 3) * 2)) & 3;
    if ((v === 1 || v === 2) && byName.has(n)) out[n] = v;
  });
  return out;
}
const counts = s => { const c = [0, 0, 0]; feats.forEach(f => c[s[f.properties.name] || 0]++); return c; };

const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg, ms = 2600) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); return ok;
}
document.getElementById('share').onclick = async () => {
  const c = counts(state);
  if (!c[1] && !c[2]) { toast('Сначала отметьте регионы, где вы были'); return; }
  const url = location.href.split('#')[0] + '#map=1.' + encodeMap(state);
  const text = `Я побывал в ${c[1] + c[2]} из ${feats.length} регионов России`;
  if (navigator.share && !hoverMQ.matches) {
    try { await navigator.share({ title: 'Где я был в России', text, url }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  if (await copyText(url)) {
    toast(location.protocol === 'file:'
      ? 'Ссылка скопирована. Другим она откроется, когда страница будет опубликована'
      : 'Ссылка на вашу карту скопирована');
  } else {
    prompt('Скопируйте ссылку:', url);
  }
};

const viewBar = document.getElementById('viewBar');
function nudgeViewBar() {
  viewBar.classList.remove('shake'); void viewBar.offsetWidth; viewBar.classList.add('shake');
  if (isPhone()) toast('Это чужая карта — отмечать можно на своей');
}
function refreshAll() {
  document.body.classList.toggle('viewing', !!viewing);
  if (viewing) {
    const c = counts(viewing);
    document.getElementById('viewStats').textContent = `${c[1] + c[2]} из ${feats.length} регионов, столиц — ${c[2]}`;
  }
  paint(); stats(); renderList(); measureHead();
}
function readHash() {
  const m = location.hash.match(/^#map=1\.([A-Za-z0-9_-]*)$/);
  viewing = null;
  if (m) { try { viewing = decodeMap(m[1]); } catch (e) { toast('Ссылка на карту повреждена'); } }
  refreshAll();
}
function leaveView() {
  history.replaceState(null, '', location.href.split('#')[0]);
  viewing = null; refreshAll();
}
document.getElementById('leave').onclick = leaveView;
document.getElementById('adopt').onclick = () => {
  const mine = counts(state);
  if ((mine[1] || mine[2]) && encodeMap(state) !== encodeMap(viewing) &&
      !confirm('Заменить вашу карту этой? Ваши текущие отметки пропадут.')) return;
  state = { ...viewing }; save();
  leaveView();
  toast('Готово, теперь это ваша карта');
};
window.addEventListener('hashchange', readHash);

readHash();
